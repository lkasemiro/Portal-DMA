<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Módulo Aedes | DMA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --sidebar-width: 260px;
      --primary-blue: #0b3d91;
      --dark-blue: #001d3d;
      --accent-green: #16a34a;
      --danger-red: #ef4444;
      --bg-gray: #f4f7fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-gray); display: flex; }

    /* --- SIDEBAR FIXA (IDENTIDADE DMA) --- */
    .sidebar { 
      width: var(--sidebar-width);
      background: var(--dark-blue); 
      color: white; 
      position: fixed; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      z-index: 100; 
      box-shadow: 4px 0 15px rgba(0,0,0,0.1);
    }
    .sidebar__header { padding: 25px 20px; background: rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; }
    .logo-dma-estilizado { 
      width: 45px; height: 45px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); 
      border-radius: 10px; display: flex; align-items: center; justify-content: center; 
      color: white; font-weight: 900; font-size: 1.2rem;
      border: 2px solid rgba(255,255,255,0.2); 
    }
    .brand-name { display: flex; flex-direction: column; }
    .brand-name b { font-size: 1.1rem; color: white; }
    .brand-name span { font-size: 0.65rem; color: #22c55e; text-transform: uppercase; font-weight: bold; }
    
    .sidebar__nav { flex: 1; padding: 20px 0; }
    .nav-item { 
      display: flex; align-items: center;
      gap: 12px; padding: 12px 25px; 
      color: rgba(255,255,255,0.6); text-decoration: none; transition: 0.3s; 
    }
    .nav-item:hover, .nav-item.active { color: white; background: rgba(255,255,255,0.08); border-left: 4px solid #22c55e; }

    /* --- CONTEÚDO PRINCIPAL --- */
    .main-content {
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      padding: 40px;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 30px;
    }

    .btn-export {
      background-color: var(--accent-green);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.2);
    }

    /* --- PAINEL E TABELA --- */
    .panel {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #eef2f6;
    }
    .panel-header {
      padding: 20px 25px;
      background: #fcfdfe;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 800;
      color: var(--dark-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #containerTabelaAedes {
        width: 100%;
        overflow-x: auto;
    }

    .tabela-custom {
        width: 100%;
        min-width: 1000px;
        border-collapse: collapse;
    }
    .tabela-custom th { background: #f8fafc; padding: 18px; text-align: left; color: #64748b; font-size: 0.75rem; text-transform: uppercase; border-bottom: 2px solid #edf2f7; }
    .tabela-custom td { padding: 18px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
    .badge { padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 0.7rem; }
    .badge--danger { background: #fee2e2; color: #ef4444; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar__header">
      <div class="logo-dma-estilizado">DMA</div>
      <div class="brand-name">
          <span>DEPARTAMENTO DE</span>
          <b>MEIO AMBIENTE</b>
          <span>SISTEMA DE GESTÃO</span>
      </div>
    </div>
    <nav class="sidebar__nav">
      <a href="./area-tecnica.html" class="nav-item"><i class="fas fa-shield-alt"></i> Auditoria & Hub</a>
      <a href="./aedes-tecnico.html" class="nav-item active"><i class="fas fa-bug"></i> Módulo Aedes</a>
      <a href="./aedes-painel.html" class="nav-item"><i class="fas fa-chart-bar"></i> Painel Analítico</a>
      <a href="./recicla-tecnico.html" class="nav-item"><i class="fas fa-recycle"></i> Módulo Recicla</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="header-flex">
      <div>
        <h1 style="color: var(--dark-blue); font-size: 2rem;">Módulo Aedes</h1>
        <p style="color: #64748b">Relatório consolidado por unidade e tratamento de focos.</p>
      </div>
      
      <button id="btnExportExcel" class="btn-export">
        <i class="fas fa-file-excel"></i> EXPORTAR CONSOLIDADO
      </button>
    </div>

    <section class="panel">
      <div class="panel-header">
        <i class="fas fa-th-list"></i> Registros de Inspeção Individualizados
      </div>
      
      <div id="containerTabelaAedes">
        <div style="padding: 50px; text-align: center; color: #94a3b8;">
          <i class="fas fa-circle-notch fa-spin fa-2x"></i>
          <p style="margin-top: 15px; font-weight: 500;">Processando base de dados...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./js/core/api-config.js"></script>
  <script src="./js/core/auth.js"></script>
  <script type="module" src="./js/pages/aedes-tecnico.js"></script>
</body>
</html>
