<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ÁREA TÉCNICA | DMA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --sidebar-width: 260px;
      --primary-blue: #0b3d91;
      --dark-blue: #001d3d;
      --accent-green: #16a34a;
      --teal-cedae: #0f766e;
      --danger-red: #ef4444;
      --bg-gray: #f4f7fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-gray); display: flex; }

    /* --- SIDEBAR --- */
    .sidebar { 
      width: var(--sidebar-width); background: var(--dark-blue); color: white; 
      position: fixed; height: 100vh; display: flex; flex-direction: column; z-index: 100; 
      box-shadow: 4px 0 15px rgba(0,0,0,0.1); 
    }
    .sidebar__header { padding: 25px 20px; background: rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; }
    .logo-dma-estilizado { 
      width: 45px; height: 45px; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); 
      border-radius: 10px; display: flex; align-items: center; justify-content: center; 
      color: white; font-weight: 900; font-size: 1.2rem; border: 2px solid rgba(255,255,255,0.2); 
    }
    .brand-name { display: flex; flex-direction: column; }
    .brand-name b { font-size: 1.1rem; color: white; }
    .brand-name span { font-size: 0.65rem; color: #22c55e; text-transform: uppercase; font-weight: bold; }
    .sidebar__nav { flex: 1; padding: 20px 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 25px; color: rgba(255,255,255,0.6); text-decoration: none; transition: 0.3s; }
    .nav-item:hover, .nav-item.active { color: white; background: rgba(255,255,255,0.08); border-left: 4px solid #22c55e; }

    /* --- CONTEÚDO PRINCIPAL --- */
    .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 40px; }
    .header-flex { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
    .painel-controles { display: flex; align-items: center; gap: 15px; }
    
    .select-semana {
      padding: 11px 15px; border-radius: 8px; border: 1px solid #cbd5e1;
      background-color: white; font-size: 0.9rem; font-weight: 600; color: var(--dark-blue);
      outline: none; min-width: 320px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: 0.2s;
    }
    .select-semana:focus { border-color: var(--teal-cedae); }

    .btn-export {
      background-color: var(--teal-cedae); color: white; border: none; padding: 12px 24px;
      border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center;
      gap: 10px; box-shadow: 0 4px 10px rgba(15, 118, 110, 0.2); transition: 0.2s;
    }
    .btn-export:hover { background-color: #0d5f58; }

    /* --- TABELA E PAINEL --- */
    .panel { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #eef2f6; }
    .panel-header { padding: 20px 25px; background: #fcfdfe; border-bottom: 1px solid #f1f5f9; font-weight: 800; color: var(--dark-blue); display: flex; align-items: center; gap: 10px; }
    #containerTabelaAedes { width: 100%; overflow-x: auto; }
    
    .tabela-aedes-dma { width: 100%; border-collapse: collapse; min-width: 1100px; }
    .tabela-aedes-dma th { background: #f8fafc; padding: 16px 18px; text-align: left; color: #64748b; font-size: 0.75rem; text-transform: uppercase; border-bottom: 2px solid #edf2f7; }
    .tabela-aedes-dma td { padding: 16px 18px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; color: #334155; }

    /* --- DESIGN DINÂMICO --- */
    .status-nao-informado { background-color: #fef3c7 !important; color: #b45309 !important; font-weight: bold; }
    .status-foco-alerta { background-color: #fee2e2 !important; color: #991b1b !important; font-weight: bold; }
    
    .alert { padding: 20px; border-radius: 8px; margin: 25px; font-weight: 500; }
    .alert-info { background-color: #f0fdfa; color: #0f766e; border: 1px solid #ccfbf1; }
    .alert-danger { background-color: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar__header">
      <div class="logo-dma-estilizado">DMA</div>
      <div class="brand-name"><span>DEPARTAMENTO DE</span><b>MEIO AMBIENTE</b><span></span></div>
    </div>
   <nav class="sidebar__nav">
      <a href="./area-tecnica.html" class="nav-item"><i class="fas fa-shield-alt"></i> Histórico de Registros</a>
      <a href="./aedes-tecnico.html" class="nav-item active"><i class="fas fa-bug"></i> Módulo Aedes</a>
      <a href="./aedes-painel.html" class="nav-item"><i class="fas fa-chart-bar"></i> Dashboard Dengue</a>
      <a href="./recicla-fase1.html" class="nav-item"><i class="fas fa-recycle"></i>Recicla fase 1</a>
      <a href="./recicla-fase2.html" class="nav-item"><i class="fas fa-recycle"></i>Recicla fase 2</a>
      <a href="./index.html" class="nav-item" style="margin-top: auto; color: #ff4d4d;"><i class="fas fa-sign-out-alt"></i> Sair</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="header-flex">
      <div>
        <h1 style="color: var(--dark-blue); font-size: 2rem;">Programa de Combate ao Aedes Aegypti</h1>
        <p style="color: #64748b">Relatório Consolidado Automático (Portal & Planilha Histórica).</p>
      </div>
      
      <div class="painel-controles">
        <select id="selectFiltroSemana" class="select-semana">
          <option value="carregando">Sincronizando cronograma de semanas...</option>
        </select>
        <button id="btnExportExcel" class="btn-export">
          <i class="fas fa-file-excel"></i> EXPORTAR CONSOLIDADO (xlsx)
        </button>
      </div>
    </div>

    <section class="panel">
      <div class="panel-header"><i class="fas fa-th-list"></i> Tabela Consolidada </div>
      <div id="containerTabelaAedes">
        <div style="padding: 60px; text-align: center; color: #94a3b8;">
          <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--teal-cedae)"></i>
          <p style="margin-top: 15px; font-weight: 500; color: #64748b;">Consultando e Processando dados</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./js/core/api-config.js"></script>
  <script src="./js/core/auth.js"></script>
  
  <script type="module" src="./js/pages/aedes-tecnico.js"></script>
</body>
</html>
