<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso Técnico | Portal DMA</title>
  <meta
    name="description"
    content="Acesso técnico temporário do Portal DMA"
  />
  <meta name="theme-color" content="#0b3d91" />

  <link rel="icon" href="./assets/icon.png" type="image/png" />
  <link rel="stylesheet" href="./css/global.css" />

  <style>
    body{
      min-height:100vh;
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
      background:
        linear-gradient(180deg, rgba(11,61,145,.10), rgba(11,61,145,0)),
        #0b1324;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-sizing:border-box;
    }

    .login-card{
      width:100%;
      max-width:380px;
      background:#ffffff;
      padding:32px;
      border-radius:20px;
      box-shadow:0 18px 48px rgba(0,0,0,.24);
      border:1px solid rgba(11,19,36,.08);
    }

    .login-card__eyebrow{
      margin:0 0 8px;
      color:#0b66c3;
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .login-card h1{
      margin:0 0 10px;
      font-size:1.5rem;
      line-height:1.2;
      color:#0b1324;
    }

    .login-card__text{
      margin:0 0 24px;
      color:#4b5563;
      line-height:1.55;
      font-size:.95rem;
    }

    .field{
      margin-top:14px;
    }

    .field label{
      display:block;
      margin-bottom:6px;
      font-size:.85rem;
      font-weight:700;
      color:#334155;
    }

    .field input{
      width:100%;
      min-height:46px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(11,19,36,.14);
      font:inherit;
      box-sizing:border-box;
      outline:none;
    }

    .field input:focus{
      border-color:rgba(11,102,195,.45);
      box-shadow:0 0 0 3px rgba(11,102,195,.12);
    }

    .login-card__actions{
      display:flex;
      gap:10px;
      margin-top:22px;
      flex-wrap:wrap;
    }

    .login-card__actions .btn{
      flex:1 1 140px;
      justify-content:center;
    }

    .login-error{
      min-height:20px;
      margin-top:12px;
      color:#b42318;
      font-size:.88rem;
      line-height:1.4;
    }

    .login-note{
      margin-top:18px;
      padding:12px 14px;
      border-radius:14px;
      background:#f8fbff;
      border:1px solid rgba(11,102,195,.10);
      color:#475467;
      font-size:.84rem;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <main class="login-card" aria-label="Acesso técnico do Portal DMA">
    <p class="login-card__eyebrow">Portal DMA</p>
    <h1>Acesso técnico</h1>
    <p class="login-card__text">
      Use o acesso temporário configurado para entrar no ambiente interno.
      As credenciais não devem permanecer no código-fonte.
    </p>

    <div class="field">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />
    </div>

    <div class="login-card__actions">
      <button id="loginBtn" class="btn btn--primary" type="button">Entrar</button>
      <a href="./index.html" class="btn btn--ghost">Voltar ao portal</a>
    </div>

    <div id="loginError" class="login-error" aria-live="polite"></div>

    <div class="login-note">
      Configuração esperada fora deste arquivo:
      <strong>window.DMA_LOGIN_CONFIG</strong>.
    </div>
  </main>

  <script>
    window.DMA_LOGIN_CONFIG = {
      user: "dma_tecnico",
      password: "DMA@2026",
      redirectTo: "./area-tecnica.html",
      role: "tecnico",
      module: "portal_dma"
    };
  </script>
  <script src="./js/core/auth.js"></script>
</body>
</html>
