<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aedes | Seleção de Focal</title>
  
  <link rel="icon" href="../assets/icon.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../css/global.css" />

  <style>
    :root {
      --primary-blue: #0b3d91;
      --dark-blue: #001d3d;
      --accent-green: #22c55e;
      --accent-yellow: #facc15;
      --white: #ffffff;
      --bg-canvas: #cbd5e1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      height: 100vh; width: 100vw;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-canvas);
    }

    .viewport-wrapper {
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2vh 2vw;
    }

    .main-canvas {
      width: 100%; height: 100%;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* TOPBAR COMPACTA */
    .focais-topbar {
      height: 7vh; min-height: 60px;
      padding: 0 2vw;
      display: flex; justify-content: space-between; align-items: center;
      background: var(--white);
      border-bottom: 1px solid #e2e8f0;
    }

    .btn-publico-top {
      background: var(--accent-yellow);
      color: var(--dark-blue);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800; font-size: 0.75rem;
      text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 10px rgba(250, 204, 21, 0.2);
    }

    .focais-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      height: 93vh;
    }

    .split-col {
      display: flex; flex-direction: column;
      height: 100%;
    }

    /* LADO ESQUERDO: IMAGEM COM AFASTAMENTO (padding) */
    .col-visual {
      background: #ffffff;
      border-right: 1px solid #f1f5f9;
      justify-content: center;
      /* Ajuste Final: Adicionado padding para afastar a imagem das bordas */
      padding: 5vh 5vw; 
    }

    .image-container {
      width: 100%; height: 100%; /* Ocupa todo o espaço interno definido pelo padding */
      background-image: url('../assets/dengue_icon2.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    
/* 1. Garante que a coluna da lista ocupe o espaço disponível e permita rolagem interna */
.col-list {
  background-color: #f8fafc;
  padding: 3vh 2vw;
  display: flex;
  flex-direction: column;
  overflow: hidden; /* Evita que a coluna inteira role */
}

/* 2. O header fica fixo no topo da coluna */
.list-header { 
  margin-bottom: 2vh; 
  flex-shrink: 0; 
}

/* 3. AJUSTE PRINCIPAL: O grid agora é quem controla a rolagem */
.focais-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  
  /* Aumente este valor para ganhar espaço vertical */
  height: 70vh; 
  
  /* Garante que o scroll apareça */
  overflow-y: auto; 
  padding-right: 10px;
  
  /* Ajuste para os cards não ficarem esticados */
  grid-auto-rows: min-content; 
  align-content: start;
}

/* Personalização da scrollbar para Chrome/Edge/Safari */
.focais-grid::-webkit-scrollbar {
  width: 6px;
}
.focais-grid::-webkit-scrollbar-thumb {
  background-color: #cbd5e1;
  border-radius: 10px;
}

    /* CSS DOS CARDS */
    .focal-card {
      background: white;
      padding: 10px 15px;
      border-radius: 12px;
      display: flex; align-items: center; gap: 12px;
      border: 1px solid rgba(0,0,0,0.05);
      cursor: pointer; transition: 0.2s;
    }

    .focal-card:hover {
      border-color: var(--primary-blue);
      transform: translateX(3px);
      box-shadow: 0 4px 12px rgba(11, 61, 145, 0.08);
    }

    .focal-card__avatar {
      width: 36px; height: 36px;
      background: var(--primary-blue); color: white;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.9rem;
      flex-shrink: 0;
    }

    .focal-card__content h3 {
      font-size: 0.85rem; color: #1e293b; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .focal-card-btn__action {
      font-size: 0.65rem; font-weight: 700; color: var(--primary-blue);
      text-transform: uppercase; opacity: 0.7;
    }

    /* MODAL */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px);
      z-index: 1000; align-items: center; justify-content: center;
    }
    .modal.is-active { display: flex; }

    .modal-content {
      background: white; width: min(380px, 90%);
      padding: 30px; border-radius: 20px; position: relative;
    }

    @media (max-width: 900px) {
      .focais-content { grid-template-columns: 1fr; }
      .col-visual { display: none; }
      .focais-grid { grid-template-columns: 1fr; height: auto; }
      body { overflow-y: auto; }
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <div class="main-canvas">
      
      <header class="focais-topbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="background: var(--primary-blue); color:white; padding:4px 8px; border-radius:6px; font-weight:900; font-size:0.7rem;">DMA</div>
          <strong style="color:var(--dark-blue); font-size:0.85rem;">Sistema Operacional <em>Aedes aegypti</em></strong>

        </div>

        <div style="display:flex; align-items:center; gap:15px;">
          <a href="./aedes.html" class="btn-publico-top">
            <i class="fas fa-certificate"></i>
            <span>CERTIFICADOS</span>
          </a>
          <a href="../autenticacao/index.html" style="color: #94a3b8;"><i class="fas fa-times"></i></a>
        </div>
      </header>

      <div class="focais-content">
        <section class="split-col col-visual">
          <div class="image-container"></div>
        </section>

        <section class="split-col col-list">
          <div class="list-header">
            <h2>Preenchimento do Controle Semanal de Vistoria</h2>
            <span class="counter-badge" style="font-size: 0.7rem; color: #64748b; background: #e2e8f0; padding: 2px 8px; border-radius: 10px;">
                <span id="focaisCounter">0</span> Profissionais Disponíveis
            </span>
          </div>

          <div id="focaisGrid" class="focais-grid">
            <p style="text-align: center; color: #64748b; font-size: 0.8rem;">Carregando base de dados...</p>
          </div>
        </section>
      </div>

    </div>
  </div>

  <div id="loginModal" class="modal">
    <div class="modal-content">
      <button id="closeLoginModal" style="position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer;">&times;</button>
      <div style="background: #f8fafc; padding: 25px; border-radius: 16px; margin-bottom: 25px; text-align: center; border: 1px solid #e2e8f0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
        <span style="display: block; font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;">Profissional Selecionado</span>
        <h3 id="selectedFocalName" style="color: var(--primary-blue); font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; text-transform: uppercase;">---</h3>
      </div>
     <form id="focalLoginForm">
  <input type="hidden" id="selectedFocalId" />
  
  <div style="margin-bottom: 15px;">
    <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:5px; color:#475569;">
      Senha: Número da Matrícula 
    </label>
    <input 
      type="text" 
      id="focalMatricula" 
      style="width:100%; padding:12px; border-radius:8px; border:2px solid #e2e8f0; font-size: 1.1rem; text-align: center; letter-spacing: 2px;" 
      placeholder="0-000000-0" 
      required 
    />
    <p style="font-size: 0.7rem; color: #94a3b8; margin-top: 8px; text-align: center;">
      <i class="fas fa-info-circle"></i> Use o formato padrão: <strong>0-000000-0</strong>
    </p>
  </div>

  <div id="loginError" style="color: #ef4444; font-size: 0.75rem; margin-bottom: 10px; text-align: center; font-weight: bold;"></div>
  
  <button type="submit" style="width:100%; padding:14px; background:var(--primary-blue); color:white; border:none; border-radius:10px; font-weight:800; cursor:pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <i class="fas fa-sign-in-alt"></i> ACESSAR GRADE
  </button>
</form>
    </div>
  </div>

  <script type="module" src="../js/core/api-config.js"></script>
  <!-- Procure no final do arquivo HTML e garanta o type="module" -->
  <script type="module" src="../js/pages/aedes/aedes-focais.js"></script>
</body>
</html>
